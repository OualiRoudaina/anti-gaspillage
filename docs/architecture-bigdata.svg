<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 640" width="1320" height="640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="flecheTodo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
  </defs>
  <rect width="1320" height="640" fill="#ffffff"/>

  <text x="40" y="40" font-size="24" font-weight="600" fill="#222">Plateforme anti-gaspillage : avancement de la partie Big Data</text>
  <text x="40" y="64" font-size="14" fill="#666">Odoo → Kafka → Spark Streaming → Redis → Odoo, avec le calcul du risque d'invendu à chaque vente</text>

  <!-- Odoo -->
  <rect x="40" y="135" width="150" height="70" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="115" y="165" text-anchor="middle" font-size="16" font-weight="600" fill="#222">Odoo</text>
  <text x="115" y="187" text-anchor="middle" font-size="12" fill="#444">produits, lots, dates</text>

  <!-- Générateur -->
  <rect x="40" y="325" width="150" height="70" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="115" y="355" text-anchor="middle" font-size="16" font-weight="600" fill="#222">Générateur</text>
  <text x="115" y="377" text-anchor="middle" font-size="12" fill="#444">ventes de 3 magasins</text>

  <!-- Kafka -->
  <rect x="290" y="100" width="210" height="340" rx="10" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
  <text x="395" y="124" text-anchor="middle" font-size="16" font-weight="600" fill="#222">Kafka</text>
  <rect x="310" y="140" width="170" height="60" rx="6" fill="#ffffff" stroke="#e08a00"/>
  <text x="395" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#222">topic lots</text>
  <text x="395" y="186" text-anchor="middle" font-size="12" fill="#444">3 partitions</text>
  <rect x="310" y="330" width="170" height="60" rx="6" fill="#ffffff" stroke="#e08a00"/>
  <text x="395" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="#222">topic ventes</text>
  <text x="395" y="376" text-anchor="middle" font-size="12" fill="#444">3 partitions, clé = magasin</text>

  <!-- Spark streaming -->
  <rect x="600" y="230" width="210" height="150" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="705" y="258" text-anchor="middle" font-size="16" font-weight="600" fill="#222">Spark Streaming</text>
  <text x="705" y="282" text-anchor="middle" font-size="12" fill="#444">micro-batchs de 2 s + checkpoint</text>
  <text x="705" y="304" text-anchor="middle" font-size="12" fill="#444">1. déduplication par vente_id</text>
  <text x="705" y="324" text-anchor="middle" font-size="12" fill="#444">2. décrément atomique du stock</text>
  <text x="705" y="344" text-anchor="middle" font-size="12" fill="#444">3. calcul du risque et remise</text>

  <!-- Redis -->
  <rect x="910" y="200" width="200" height="140" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="1010" y="228" text-anchor="middle" font-size="16" font-weight="600" fill="#222">Redis</text>
  <text x="1010" y="256" text-anchor="middle" font-size="12" fill="#444">lot:{id} (stock, risque, remise)</text>
  <text x="1010" y="278" text-anchor="middle" font-size="12" fill="#444">alertes:{magasin}</text>
  <text x="1010" y="300" text-anchor="middle" font-size="12" fill="#444">vente:{id} (anti-doublon)</text>
  <text x="1010" y="322" text-anchor="middle" font-size="12" fill="#444">vitesse:{id} (remplie par le batch)</text>

  <!-- À faire : MongoDB -->
  <rect x="910" y="60" width="200" height="70" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1010" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#666">MongoDB</text>
  <text x="1010" y="112" text-anchor="middle" font-size="12" fill="#777">historique des alertes</text>

  <!-- À faire : Batch -->
  <rect x="600" y="470" width="210" height="70" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="705" y="500" text-anchor="middle" font-size="16" font-weight="600" fill="#222">Spark Batch + Parquet</text>
  <text x="705" y="522" text-anchor="middle" font-size="12" fill="#444">vitesse de vente par lot</text>

  <!-- À faire : synchro Odoo -->
  <rect x="1160" y="200" width="130" height="140" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="1225" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Synchro</text>
  <text x="1225" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#222">vers Odoo</text>
  <text x="1225" y="304" text-anchor="middle" font-size="12" fill="#444">risque + remise</text>

  <!-- Flèches faites -->
  <line x1="190" y1="170" x2="308" y2="170" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="249" y="158" text-anchor="middle" font-size="11" fill="#555">export_lots.py</text>

  <line x1="190" y1="360" x2="308" y2="360" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="249" y="348" text-anchor="middle" font-size="11" fill="#555">generateur_ventes.py</text>

  <path d="M480,170 C540,170 540,270 598,270" fill="none" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="545" y="205" font-size="11" fill="#555">init du stock</text>

  <line x1="480" y1="360" x2="598" y2="340" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>

  <line x1="810" y1="290" x2="908" y2="270" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>

  <!-- Flèches à faire -->
  <path d="M780,230 L780,95 L908,95" fill="none" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flecheTodo)"/>
  <line x1="705" y1="380" x2="705" y2="468" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="717" y="430" font-size="11" fill="#555">lecture des ventes</text>
  <path d="M810,505 L1010,505 L1010,342" fill="none" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="860" y="495" font-size="11" fill="#555">vitesse moyenne</text>
  <line x1="1110" y1="270" x2="1158" y2="270" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>

  <!-- Fichiers -->
  <text x="600" y="402" font-size="11" fill="#555">spark/jobs/ventes_streaming.py</text>
  <text x="600" y="418" font-size="11" fill="#555">spark/jobs/risque.py</text>

  <!-- Légende -->
  <rect x="40" y="590" width="26" height="16" rx="3" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="76" y="603" font-size="13" fill="#333">Fait</text>
  <rect x="140" y="590" width="26" height="16" rx="3" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="176" y="603" font-size="13" fill="#333">À faire</text>
  <rect x="260" y="590" width="26" height="16" rx="3" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
  <text x="296" y="603" font-size="13" fill="#333">Fait (Kafka)</text>
</svg>
